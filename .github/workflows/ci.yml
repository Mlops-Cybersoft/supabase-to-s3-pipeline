name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exporter test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Validate Python and notebook source
        run: |
          python -m py_compile src/export_pipeline.py app/pipeline.py app/cli.py dags/supabase_s3_training_pipeline.py scripts/init_mlflow_db.py
          python -c "import json; json.load(open('notebooks/supabase_pooler_to_s3.ipynb')); print('Notebook JSON valid')"
      - name: Run unit tests
        run: python -m pytest -q
      - name: Validate Docker Compose
        env:
          S3_EXPORT_BUCKET: ci-validation-bucket
        run: docker compose config --quiet
